services:
  frontend:
    build:
      context: .
      target: frontend

  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      PORT: 3000

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
