services:
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: "2"
      SQLITE_DB_PATH: /app/backend/data/academy.sqlite
      FILE_STORAGE_PATH: /app/backend/data/uploads
    volumes:
      - academy-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3000/api/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error',
          () => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  academy-data:
