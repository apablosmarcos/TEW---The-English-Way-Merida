services:
  frontend:
    build:
      context: .
      target: frontend

  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_DB_PATH: /app/backend/data/academy.sqlite
      FILE_STORAGE_PATH: /app/backend/data/uploads
    volumes:
      - academy-data:/app/backend/data

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  academy-data:
